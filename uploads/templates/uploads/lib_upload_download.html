{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-green-50">
    <div class="mt-6 text-center">
        <a href="{% url 'nav_home' %}" class="text-green-600 hover:text-green-800 transition duration-300 ease-in-out">
            <i class="fas fa-arrow-left mr-2"></i>
            Back to Dashboard
        </a>
    </div>
    
    <main class="container mx-auto px-4 py-8">
        <div class="mb-8 flex flex-col md:flex-row gap-4">
            <div class="relative w-full md:w-1/3">
                <input
                    type="text"
                    id="search"
                    name="search"
                    placeholder="Search writings..."
                    class="w-full pl-10 pr-4 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                    value="{{ search_query|default:'' }}"
                >
                <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-2.5 h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <select id="department" class="w-full md:w-1/4 px-4 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                <option value="">All Departments</option>
                <!-- Add department options dynamically -->
            </select>
            <select id="level" class="w-full md:w-1/4 px-4 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                <option value="">All Levels</option>
                <!-- Add level options dynamically -->
            </select>
        </div>
        
        <div id="writing-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% include 'uploads/partials/document_list.html' %}
        </div>
    </main>

    <script>
        const searchInput = document.getElementById('search');
        const departmentSelect = document.getElementById('department');
        const levelSelect = document.getElementById('level');
        const writingList = document.getElementById('writing-list');

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function updateResults() {
            const searchQuery = searchInput.value;
            const department = departmentSelect.value;
            const level = levelSelect.value;

            let url = `{% url 'lib_material_view_page' %}?search=${searchQuery}`;
            if (department) url += `&department=${department}`;
            if (level) url += `&level=${level}`;

            fetch(url, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                writingList.innerHTML = data.html;
            });
        }

        const debouncedUpdateResults = debounce(updateResults, 300);

        searchInput.addEventListener('input', debouncedUpdateResults);
        departmentSelect.addEventListener('change', updateResults);
        levelSelect.addEventListener('change', updateResults);

        // Fetch departments and levels on page load
        fetch('{% url "get_departments_and_levels" %}')
            .then(response => response.json())
            .then(data => {
                data.departments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept;
                    option.textContent = dept;
                    departmentSelect.appendChild(option);
                });

                data.levels.forEach(level => {
                    const option = document.createElement('option');
                    option.value = level;
                    option.textContent = level;
                    levelSelect.appendChild(option);
                });
            });
    </script>
</body>
</html>
