{% for document in writings %}
    <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-2 text-green-800">{{ document.title }}</h2>
        <p class="text-green-600 mb-4">{{ document.department }}</p>
        <p class="text-green-600 mb-4">{{ document.author }}</p>
        <p class="text-green-600 mb-4">{{ document.snippet }}</p>
        <a
            href="{% url "file_download" document.id%}"
            download
            class="inline-flex items-center px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            Download
        </a>
    </div>
{% empty %}
    <p class="col-span-full text-center text-gray-500">No documents found.</p>
{% endfor %}
