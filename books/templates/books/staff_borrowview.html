
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Books as Returned</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body class="min-h-screen bg-green-50 p-8">
    {% include "core/partials/messages.html" %}
<!--Scan and return-->
<!--oVERDUE SUNDAY SET-->
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold text-green-800 mb-8">Mark Books as Returned</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="flex items-center mb-4">
                <div class="relative flex-grow">
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search by book title or borrower name"
                        class="w-full py-2 pl-10 pr-4 text-gray-700 bg-gray-100 rounded-full focus:outline-none focus:bg-white focus:ring-2 focus:ring-green-500"
                    >
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                </div>
            </div>
            
            <div id="books-table" class="overflow-x-auto">
                <!-- Table content will be dynamically updated here -->
            </div>
            
            <div class="mt-6 text-center">
                <a href="{% url 'staff_home_page' %}" class="text-green-600 hover:text-green-800 transition duration-300 ease-in-out">
                    <i class="fas fa-arrow-left mr-2"></i>
                    Back to Dashboard
                </a>
            </div>
        </div>
    </div>
    
    <script>
        $(document).ready(function() {
            function updateTable(data) {
                let tableHtml = `
                    <table class="min-w-full bg-white">
                        <thead class="bg-green-500 text-white">
                            <tr>
                                <th class="py-3 px-4 text-left">Book Title</th>
                                <th class="py-3 px-4 text-left">Borrower</th>
                                <th class="py-3 px-4 text-left">Borrow Date</th>
                                <th class="py-3 px-4 text-left">Due Date</th>
                                <th class="py-3 px-4 text-left">Overdue</th>
                                <th class="py-3 px-4 text-left">Returned</th>
                                <th class="py-3 px-4 text-left">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-green-200">
                `;

                data.books.forEach(book => {
                    tableHtml += `
                        <tr class="hover:bg-green-50">
                            <td class="py-2 px-4">${book.title}</td>
                            <td class="py-2 px-4">${book.borrower}</td>
                            <td class="py-2 px-4">${book.borrowed_date}</td>
                            <td class="py-2 px-4">${book.return_date}</td>
                            <td class="py-2 px-4">
                                ${book.overdue 
                                    ? '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Overdue</span>'
                                    : '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">On Time</span>'
                                }
                            </td>
                            <td class="py-2 px-4">
                                ${book.returned
                                    ? '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Returned</span>'
                                    : '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Not returned</span>'
                                }
                            </td>
                            <td class="py-2 px-4">
                                <button type="submit" class="bg-black hover:bg-green-600 text-white py-1 px-3 rounded-full transition duration-300 ease-in-out flex items-center">
                                    <a href="/books/staff_borrowaction/${book.id}"><i class="fas fa-check mr-1"></i>View</a>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                tableHtml += `
                        </tbody>
                    </table>
                `;

                $('#books-table').html(tableHtml);
            }

            function performSearch() {
                let searchQuery = $('#search-input').val();
                $.ajax({
                    url: '{% url "staff_borrowview_page" %}',
                    data: {
                        'search': searchQuery
                    },
                    dataType: 'json',
                    success: function(data) {
                        updateTable(data);
                    }
                });
            }

            let debounceTimer;
            $('#search-input').on('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(performSearch, 300);
            });

            // Initial load
            performSearch();
        });
    </script>
</body>
</html>
