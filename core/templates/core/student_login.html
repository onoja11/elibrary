{% extends "core/base.html" %}

{% block title %}Student Login{% endblock title %}

{% block body %}
<style>
    .eye{
        margin-bottom:40px;
        margin-top:5px;
    }
</style>

{% comment %} <body class="min-h-screen bg-fixed bg-[url('/static/image/karsten-winegeart-eXFG9dM_1f8-unsplash.jpg')] bg-no-repeat bg-center bg-cover flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8"> {% endcomment %}
<body class="min-h-screen bg-fixed bg-[url('/static/mage/karsten-winegeart-eXFG9dM_1f8-unsplash.jpg')] bg-no-repeat bg-center bg-cover flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class=" max-w-sm w-full mx-auto bg-white shadow-lg  rounded-xl p-8 ">
        <h1 class="text-4xl font-bold text-green-700 mb-4 text-center">Student</h1>
        
        <form class="space-y-6" method="post" action="{% url 'student_login_page' %}">
            {% csrf_token %}
 
          
            <div class="mb-8">
                <label for="username" class="block mb-2 text-sm font-medium text-green-700">University Identification Number</label>
                <input type="text" name="username" id="username" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-green-500 focus:border-green-500" placeholder="vugsen239508 or staff_no" required />
            </div>
            
            <div>
                <label for="password" class="block mb-2 text-sm font-medium text-green-700">Password</label>
                <div class="relative">
                    <input type="password" name="password" id="password" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-green-500 focus:border-green-500" placeholder="Password" required />
                   <div class="eye"> <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400 hover:text-white focus:outline-none">
                    <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5 text-black mb-10" onclick="togglePasswordVisibility()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="eye-icon">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                      </svg>
                      </button>
                </button>
            </div>
                </div>
            </div>
            
           
            
            <button type="submit" class="w-full text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-200">
                Login
            </button>
        </form>
        
        <p class=" mt-4 text-center">Don't have an account? <a href="{% url 'student_registration_page' %}" class="text-green-700  font-bold hover:text-green-200 transition duration-200">Sign up</a></p>
        <p class=" mt-4 text-center"><a href="{% url 'index_page' %}" class="text-black hover:text-green-200 transition  font-bold duration-200">Previous</a></p>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        }
    </script>
</body>
{% endblock body %}
