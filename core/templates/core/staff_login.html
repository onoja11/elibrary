{% extends "core/base.html" %}

{% block title %}Staff Login{% endblock title %}

{% block body %}
<style>
    .eye{
        margin-bottom:20px;
        margin-top:5px;
    }
</style>
<body class="bg-[url('/static/image/karsten-winegert-eXFG9dM_1f8-unsplash.jpg')] bg-no-repeat bg-cover bg-center min-h-screen flex items-center justify-center">
    <div class=" max-w-sm w-full mx-auto bg-white shadow-lg  rounded-xl p-8 ">
        <h1 class="text-4xl font-bold text-green-700 mb-8 text-center">Admin</h1>
        
       
        <form class="space-y-6" method="post" action="{% url 'staff_login_page' %}">
            {% csrf_token %}
            
            <div class="mb-2">
                <label for="username" class="block mb-2 text-sm font-medium text-green-700">Staff ID Number</label>
                <input type="text" name="username" id="username" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-green-500 focus:border-green-500" placeholder="lib123" required />
            </div>
            
            <div class="mb-10">
                <label for="password" class="block mb-2 text-sm font-medium text-green-700">Password</label>
                <input type="password" name="password" id="password" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5 focus:ring-2 focus:ring-green-500 focus:border-green-500" placeholder="password" required />
                <div class="eye "> <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400 hover:text-white focus:outline-none ">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="eye-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
            </div>
            
        
            
            <button type="submit" class="w-full text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-200">
                Login
            </button>
        </form>
        
        <p class="text-white mt-4 text-center"><a href="{% url 'index_page' %}" class="text-black font-bold hover:text-green-200 transition duration-200">Previous </a></p>
    </div>
</body>
<script>
    function togglePasswordVisibility() {
      var passwordField = document.getElementById('password');
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
      } else {
        passwordField.type = 'password';
      }
    }
  </script>
{% endblock body %}
