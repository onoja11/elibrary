<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@^3.0/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-white text-green-800 flex items-center justify-center h-screen">
    <div class="text-center">
        <h1 class="text-6xl font-extrabold mb-4">404</h1>
        <p class="text-2xl mb-6">Oops! The page you’re looking for doesn’t exist.</p>
        <p class="mb-8">It might have been moved or deleted. Please check the URL or return to the homepage.</p>
        <a href="/" class="inline-block bg-green-500 text-white px-6 py-3 rounded-full text-lg font-semibold hover:bg-green-600 transition duration-300">Go Back Home</a>
    </div>
</body>
</html>
